[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsm-public-rf"
version = "0.1.0"
description = "Public loading and inference tools for the BSM reduced-form model"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Dylan Hettinger", email = "dylan.hettinger@nlr.gov" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["biomass", "reduced-form-model", "surrogate-model", "scientific-computing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.scripts]
bsm-rf-predict = "bsm_public_rf.cli:main"

[project.urls]
Repository = "https://github.com/NatLabRockies/bsm-public-rf"
Issues = "https://github.com/NatLabRockies/bsm-public-rf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/bsm-public-rf/model" = [
  "model/README.md",
  "model/SHA256SUMS",
  "model/coefficient_column_metadata.csv",
  "model/coefficient_matrix_raw_scale.csv",
  "model/coefficient_matrix_standardized.csv",
  "model/final_support_features.csv",
  "model/output_metadata.json",
  "model/per_output_intercepts.csv",
  "model/x_standardization.csv",
  "model/y_standardization.csv",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"examples/**/*.py" = ["D"]
