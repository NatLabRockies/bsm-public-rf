[workspace]
name = "bsm-public-rf"
version = "0.1.0"
description = "Public loading and inference tools for the BSM reduced-form model"
authors = ["Dylan Hettinger"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.24"
pandas = ">=2.0"
pytest = ">=8"
ruff = ">=0.8"
# Reads the Parquet coefficients of models in versions/.
pyarrow = ">=14"

[pypi-dependencies]
bsm-public-rf = {path = ".", editable = true}

[tasks]
test = "pytest -q"
lint = "ruff check src tests examples versions"
format-check = "ruff format --check src tests examples versions"
format = "ruff check --fix src tests examples versions && ruff format src tests examples versions"
gate = "pytest -q && ruff check src tests examples versions && ruff format --check src tests examples versions && git diff --check"
predict = "bsm-rf-predict"

[feature.notebook.dependencies]
jupyterlab = ">=4"

[feature.notebook.tasks]
notebook = "jupyter lab examples/quickstart.ipynb"
notebook-check = "jupyter nbconvert --to notebook --execute examples/quickstart.ipynb --output quickstart-executed.ipynb --output-dir build/notebooks --ExecutePreprocessor.timeout=300"

[environments]
notebook = ["notebook"]
