name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          locked: true

      - name: Run repository gate
        run: pixi run gate

  notebook:
    name: Quickstart notebook
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          locked: true

      - name: Execute quickstart notebook
        run: pixi run -e notebook notebook-check
