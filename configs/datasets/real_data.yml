# Real data configuration for manuscript reproduction
# CONFIGURE: set BSM_DATA_ROOT to the directory containing the BSM manuscript input files.
# Example: export BSM_DATA_ROOT=/path/to/bsm/simulation/data

# Input/output data matrices (must have sample_id column)
case_study_input_matrix: ${BSM_DATA_ROOT}/X.parquet
case_study_output_matrix: ${BSM_DATA_ROOT}/Y.parquet

# Metadata files
input_metadata: ${BSM_DATA_ROOT}/all_input_metadata.parquet
output_metadata: ${BSM_DATA_ROOT}/output_metadata.parquet
manuscript_feature_catalog: ${BSM_DATA_ROOT}/manuscript_feature_catalog.parquet
fixed_holdout_assignments: ${BSM_DATA_ROOT}/fixed_holdout_assignments.parquet

# Optional: default output directory (can be overridden with --output-dir)
# CONFIGURE: set this to a writable local output directory
output_root: /path/to/your/bsm/output
