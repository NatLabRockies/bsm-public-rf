[workspace]
name = "bsm-public-rf"
version = "0.1.0"
description = "Public loading and inference tools for the BSM reduced-form model"
authors = ["Dylan Hettinger"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.24"
pandas = ">=2.0"
pytest = ">=8"
ruff = ">=0.8"

[pypi-dependencies]
bsm-public-rf = {path = ".", editable = true}

[tasks]
test = "pytest -q"
lint = "ruff check src tests examples"
format-check = "ruff format --check src tests examples"
format = "ruff check --fix src tests examples && ruff format src tests examples"
predict = "python examples/predict.py"
