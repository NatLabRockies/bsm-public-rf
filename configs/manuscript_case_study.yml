contract_status: phase0_complete
contract_source: docs/manuscript_contract.md
manuscript_source: jds_bsm_v22.tex

case_study:
  interface:
    n_exogenous_inputs: 160
    n_scalar_inputs: 158
    n_boolean_inputs: 2
    n_time_series_outputs: 635
    year_start: 2015
    year_end: 2051
    n_scalar_outputs: 23495
    holdout_fraction: 0.05
    holdout_random_seed: 123
    holdout_split_rule: afsc_uaeoro_stratified_else_scenario
    holdout_split_rule_description: |
      Stratified holdout split. Preferred label is the concatenation
      of the AFSC and UAEORO binary scenario flags
      (e.g. "1_0"), giving 4 strata. If those columns are missing,
      fall back to stratifying on the scenario string. If neither is
      available, fall back to unstratified random split. Implemented
      by rfm_pipeline.data.stratified_holdout_split (seed 123).
    holdout_split_rule_status: frozen_repo_decision

  candidate_library:
    reported_candidate_count: 26560
    source_of_truth: released_feature_catalog
    exact_catalog_row_count: 26560
    source_of_truth_status: frozen_repo_decision
    first_order_rule: all 160 typed inputs in external interface order, including both binary scenario fields as first-order predictor candidates
    interaction_rule: released_feature_catalog is authoritative for declared interaction membership
    nonlinear_library:
      families:
        - quadratic
        - logarithmic
        - inverse
        - square_root
      family_list_status: frozen_from_manuscript

  output_conditioning:
    variance_filter:
      epsilon_var: 1.0e-12
      status: frozen_repo_decision
    snr_filter:
      epsilon_snr: 1.0e-2
      delta: 1.0e-12
      status: frozen_case_study_rule
    temporary_reduction:
      method: pca
      method_status: frozen_case_study_choice
      screening_target: retained_pca_scores
      retained_components: 17
      retained_variance_fraction: 0.90

  empirical_null_screen:
    statistic: coefficient_row_l2_norm
    statistic_status: frozen_from_manuscript
    public_implementation_method: coefficient_row_l2_permutation
    public_implementation_status: source_backed_public_surrogate
    source_script_reference: private_delta_null_screening_script
    source_script_equivalence_status: not_yet_validated
    permutation_count_B: 200
    permutation_count_status: frozen_source_derived_repo_decision
    # Implementation uses one observed statistic plus B null draws for its
    # finite Monte Carlo adjusted-p calculation; the manuscript reports B=200.
    bh_q_screen: 0.05

  interaction_discovery:
    method: tree_shap_interaction_values
    aggregation_rule: max_over_components_of_mean_absolute_shap_interaction
    aggregation_rule_status: frozen_repo_decision
    public_implementation_method: tree_shap_gradient_boosting
    public_implementation_status: manuscript_aligned
    source_workflow_reference: private_tree_shap_interaction_workflow
    source_workflow_equivalence_status: manuscript_aligned_via_shap_gradient_boosting
    null_threshold_quantile: 0.995
    # --- G0/B pre-execution interaction settings ---
    # The neutral adjusted-p selector and its draw floor are bound by
    # configs/method_contract.yaml before any later execution gate.
    family_error_method: max_stat_adjusted_p_mc
    family_error_alpha: 0.05
    permutation_count_B: 999
    minimum_selection_draws: 999

  nonlinear_discovery:
    method: gam_plus_restricted_parametric_replacement
    curvature_rule: edf_gt_1_and_smooth_pvalue_lt_0p01
    curvature_rule_status: frozen_repo_decision
    # Public implementation uses edf_threshold: 2.5 (more conservative than edf > 1);
    # the stricter threshold reduces false-positive detections in high-dimensional setting.
    replacement_selection_rule: minimum_training_rmse_against_gam_smooth
    replacement_selection_rule_status: frozen_repo_decision
    public_implementation_method: gam_cubic_smoothing_spline
    public_implementation_status: manuscript_aligned
    source_workflow_reference: private_gam_nonlinear_discovery_workflow
    source_workflow_equivalence_status: manuscript_aligned_via_scipy_smoothing_spline

  sparse_selection:
    model_class: l1_penalized_linear_model_per_retained_component
    ebic_gamma: 0.5
    support_aggregation_rule: union_nonzero_support_across_retained_components
    support_aggregation_rule_status: frozen_repo_decision
    public_implementation_method: ebic_l1_component_union_with_subsample_stability
    public_implementation_status: source_backed_public_surrogate
    source_workflow_reference: notebook_pca_debiased_lasso
    source_artifact: LASSO_to_OLS_v9.ipynb
    source_workflow_equivalence_status: not_yet_validated

  stability:
    resampling_scheme: 50_subsamples_of_80_percent_rows_without_replacement_seed_123
    resampling_scheme_status: frozen_repo_decision
    jaccard_threshold: 0.75
    jaccard_threshold_status: frozen_case_study_rule
    spearman_threshold: 0.90
    spearman_threshold_status: frozen_repo_decision

  final_inferential_filter:
    interval_method: hc3_wald_95_percent_drop_if_zero_compatible_for_all_outputs
    interval_method_status: frozen_repo_decision
    feature_pruning:
      error_scale_quantile: 0.95
      # delta_threshold_override: retain only features whose individual removal
      # improves macro nRMSE by less than this value. Derived support counts are
      # recorded only in generated artifacts.
      delta_threshold_override: 0.002

  final_model:
    nrmse_denominator_definition: macro_average_rmse_divided_by_training_response_range
    nrmse_reference_matrix: Y_train
    nrmse_definition_status: frozen_repo_decision_matching_live_code

  reproducibility_release_surface:
    released_package_wording: already_released_repo_and_artifact_bundle
    supplementary_material_contents:
      - repository_url
      - notebook_list
      - manuscript_case_study_config
      - feature_catalog
      - export_bundle_schema
      - figure_table_regeneration_instructions

phase0_blockers: []
